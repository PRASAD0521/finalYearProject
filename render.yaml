services:
  # Base Node.js Server Environment
  - type: web
    name: cyberrange-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free # Use Render's free tier
    envVars:
      - key: NODE_ENV
        value: production
      # Allow requests from the deployed frontend once built.
      # You can update this in the Render dashboard after the frontend deploys.
      - key: FRONTEND_URL
        value: https://cyberrange-frontend.onrender.com

  # Base Vite React Frontend Environment
  - type: web
    name: cyberrange-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      # Connect the frontend to the deployed backend.
      - key: VITE_API_URL
        value: https://cyberrange-backend.onrender.com
